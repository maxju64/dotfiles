#Bind prefix key to leader
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix
set -g pane-border-indicators off

#Rebind splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

#Enable mouse
set -g mouse on

#Bind sourcing config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

#Switch panes using Alt-arrow without prefix
bind -n C-M-h select-pane -L
bind -n C-M-l select-pane -R
bind -n C-M-k select-pane -U
bind -n C-M-j select-pane -D

#Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#Restoring neovim sessions
set -g @resurrect-strategy-nvim 'session'

#List of plugins
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# Enable true color support
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# Status bar position and colors
set -g status-position bottom
set -g status-style "bg=#141b1e,fg=#dadada"

# Left side: Session name in green
set -g status-left-length 30
set -g status-left "#[bg=#8ccf7e,fg=#141b1e,bold] #S #[default] "

# Window list styling
set -g window-status-format "#[fg=#b3b9b8,bg=#141b1e] #I:#W "
set -g window-status-current-format "#[bg=#232a2d,fg=#67b0e8,bold] #I:#W #[default]"

# Right side: Date and time in blue/yellow
set -g status-right-length 50
set -g status-right "#[fg=#e5c76b,bg=#141b1e] %h %d #[fg=#67b0e8]| %H:%M #[default]"
#Enable colors
set -as terminal-features ",foot*:RGB"
set -g mouse on
set-option -g allow-rename off
#set -g @catppuccin_flavour 'mocha'
set -g pane-active-border-style fg=#b4befe

#Set vi-mode
set-window-option -g mode-keys vi

#Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

#Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
run '~/.tmux/plugins/tpm/tpm'
